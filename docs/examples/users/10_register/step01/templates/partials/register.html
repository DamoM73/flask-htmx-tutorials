<article>
    <h1>Register</h1>
    <form hx-post="/register" hx-target="#content">
        <label>
            Email
            <input type="email" name="email" required>
        </label>
        <label>
            Password
            <input type="password" name="password" required>
        </label>
        <label>
            Confirm password
            <input type="password" name="confirm" required>
        </label>
        <button type="submit">Register</button>
    </form>
</article>
